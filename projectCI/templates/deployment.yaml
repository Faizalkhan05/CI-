apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  namespace: new
  labels:
    app: {{ .Values.image.labels.app }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Values.image.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.image.labels.app }}
    spec:
      containers:
      - name: nginx
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: demo-config
          items:
          - key: index.html
            path: index.html
          - key: test.html
            path: test.html